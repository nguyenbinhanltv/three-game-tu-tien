<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>%DTL_TITLE%</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23142033'/><path d='M16 3l3 17h-6z' fill='%23bfe8ff'/><rect x='10' y='20' width='12' height='2.5' fill='%23d8b36a'/><rect x='14.5' y='22' width='3' height='7' fill='%238a6a3a'/></svg>" />
    <link rel="preload" href="/fonts/dtl-title.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Khung hình đầu (M4-9): hiện tiêu đề ngay khi HTML về, trước khi bundle JS chạy. CSS ở đây
      là phần tối thiểu cho #boot; phần còn lại của màn tiêu đề nằm trong styles.css.
      Tiêu đề lấy từ i18n (`ui.title`) lúc build qua plugin trong vite.config.ts.
    -->
    <style>
      @font-face {
        font-family: 'DTL Title';
        src: url(/fonts/dtl-title.woff2) format('woff2');
        font-weight: 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #dce6df;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
        transition: opacity 0.9s ease, visibility 0s linear 0s;
      }
      #boot.gone {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.9s ease, visibility 0s linear 0.9s;
      }
      /* Trời sương sớm: ngọc lam ở đỉnh, sương ngà ở chân trời, nắng vàng ấm góc phải. */
      .ts-sky,
      .ts-hills,
      .ts-scene,
      .ts-veil {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .ts-sky {
        background:
          radial-gradient(ellipse 55% 45% at 78% 22%, rgba(242, 196, 126, 0.55), rgba(242, 196, 126, 0) 70%),
          linear-gradient(180deg, #9cc4c3 0%, #c3d9d4 38%, #dce6df 62%, #e6ddcb 100%);
      }
      .ts-hills {
        top: auto;
        height: 58%;
      }
      /* Cảnh 3D (canvas do JS gắn vào .ts-scene) ẩn tới khi dựng xong rồi mờ dần hiện ra. */
      .ts-scene {
        opacity: 0;
        transition: opacity 2.2s ease;
      }
      #boot.lit .ts-scene {
        opacity: 1;
      }
      /* Lớp sương giữ chữ dễ đọc khi cảnh 3D hiện ra phía sau. */
      .ts-veil {
        background:
          radial-gradient(ellipse 46% 26% at 50% 27%, rgba(220, 230, 223, 0.72), rgba(220, 230, 223, 0) 100%),
          linear-gradient(180deg, rgba(220, 230, 223, 0.35) 0%, rgba(220, 230, 223, 0) 34%, rgba(220, 230, 223, 0) 58%, rgba(230, 221, 203, 0.55) 100%);
      }
      .ts-title {
        position: absolute;
        left: 0;
        right: 0;
        top: 15vh;
        margin: 0;
        text-align: center;
        font: 700 clamp(64px, 10.5vw, 148px) / 1.1 'DTL Title', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
        color: #29292c;
        letter-spacing: 0.01em;
        text-shadow: 0 0 28px rgba(230, 221, 203, 0.9);
        animation: ts-in 0.5s ease-out both;
      }
      /* Chữ thư pháp (tools/calli): ảnh thay chữ; chữ thật vẫn ở aria-label + .ts-txt (lùi về chữ khi ảnh lỗi). */
      .ts-title {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 1.1em;
      }
      .ts-calli {
        height: 1.6em;
        margin-top: -0.16em;
        width: auto;
        flex: none;
        filter: drop-shadow(0 0.04em 0.12em rgba(230, 221, 203, 0.85));
      }
      .ts-title:not(.nocalli) .ts-txt,
      .ts-title:not(.nocalli) .ts-seal {
        display: none;
      }
      .ts-title.nocalli .ts-calli {
        display: none;
      }
      /* Hiện chữ theo nét bút: quét từ trái sang, mép mềm. */
      .calli-reveal {
        -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 40%, transparent 60%);
        mask-image: linear-gradient(90deg, #000 0%, #000 40%, transparent 60%);
        -webkit-mask-size: 260% 100%;
        mask-size: 260% 100%;
        -webkit-mask-position: 0 0;
        mask-position: 0 0;
        animation: calli-wipe 1.1s cubic-bezier(0.3, 0.1, 0.2, 1) 0.1s both;
      }
      @keyframes calli-wipe {
        from {
          -webkit-mask-position: 100% 0;
          mask-position: 100% 0;
        }
        to {
          -webkit-mask-position: 0 0;
          mask-position: 0 0;
        }
      }
      /* Ấn son trơn (không khắc chữ), dọc và hơi nghiêng, đóng sát cuối tiêu đề. */
      .ts-seal {
        display: inline-block;
        width: 0.2em;
        height: 0.32em;
        margin-left: 0.1em;
        vertical-align: 0.02em;
        background: #9d392e;
        border-radius: 0.02em 0.035em 0.02em 0.04em;
        transform: rotate(5deg);
        opacity: 0.88;
        mix-blend-mode: multiply;
      }
      @keyframes ts-in {
        from {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ts-title,
        .calli-reveal {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="ts-sky"></div>
      <svg class="ts-hills" viewBox="0 0 1600 600" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="ts-mist" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dce6df" stop-opacity="0" />
            <stop offset="1" stop-color="#e6ddcb" stop-opacity="0.95" />
          </linearGradient>
        </defs>
        <path fill="#b3cdc8" d="M0 260 C90 240 150 196 230 214 S360 150 430 160 S560 236 650 214 S780 176 860 196 S1000 140 1090 150 S1230 222 1330 206 S1500 178 1600 214 V600 H0Z" />
        <path fill="#94b5b2" d="M0 360 C100 330 170 292 260 312 S400 262 480 286 S600 350 700 330 S860 270 960 296 S1100 352 1190 330 S1350 268 1450 300 S1560 340 1600 330 V600 H0Z" />
        <path fill="#6f9692" d="M0 470 C120 430 200 404 300 426 S470 470 560 448 S700 400 820 430 S980 484 1080 462 S1260 404 1360 430 S1520 470 1600 452 V600 H0Z" />
        <rect y="400" width="1600" height="200" fill="url(#ts-mist)" />
      </svg>
      <div class="ts-scene"></div>
      <div class="ts-veil"></div>
      <h1 class="ts-title" aria-label="%DTL_TITLE%">
        <img class="calli ts-calli calli-reveal" src="/assets/calli/%DTL_CALLI_TITLE%" alt="" width="%DTL_CALLI_TITLE_W%" height="%DTL_CALLI_TITLE_H%" decoding="async" onerror="this.parentNode.classList.add('nocalli')" />
        <span class="ts-txt" aria-hidden="true">%DTL_TITLE%</span><span class="ts-seal" aria-hidden="true"></span>
      </h1>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
