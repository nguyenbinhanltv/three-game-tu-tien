# CI tối thiểu (R-0): cài theo lockfile, typecheck, test nhanh, content:check trên mỗi PR vào main.
# Không chạy test chậm (pnpm test:slow: ffmpeg thật), bench, shots hay playtest: những thứ đó chạy ở máy dev.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Đẩy commit mới lên cùng PR thì hủy lượt đang chạy để tiết kiệm phút.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cài dependency
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: content:check
        run: pnpm content:check

      - name: docs:check
        run: pnpm docs:check
